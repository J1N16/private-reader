plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
    id 'jacoco'
}

group = 'com.lv.tool'
version = '3.0.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.aliyun.com/repository/public'
        allowInsecureProtocol = true
    }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.xerial:sqlite-jdbc:3.53.2.1'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.6.0-jre'

    // IntelliJ Platform
    intellijPlatform {
        intellijIdea "2026.1.4"
    }

    // Test dependencies
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation platform('org.mockito:mockito-bom:5.23.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

test {
    useJUnitPlatform()
    // 测试执行完毕后生成 JaCoCo 覆盖率报告
    finalizedBy jacocoTestReport
    jacoco {
        // IntelliJ 平台用 PathClassLoader 加载插件类（无 location），须显式纳入
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

// JaCoCo 覆盖率：report 生成 XML+HTML，verification 依据阈值校验
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // instrumentCode=false 时指向编译产物；插件类由 PathClassLoader 加载，故用编译 classes 目录
    classDirectories.setFrom(sourceSets.main.output.classesDirs)
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                // 基线 18.24%（1383/7581，2026-08-13 首次测量）；V9 补测后 LINE 28.02%（2606/7581）
                // 阈值上调至 0.27 作为回归护栏，留有约 1 个百分点安全余量
                minimum = 0.27
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}

intellijPlatform {
    instrumentCode = false

    patchPluginXml {
        sinceBuild = '261'
        changeNotes = """
              <h3>3.0.0 版本更新</h3>
              <ul>
                <li>优化翻页性能，章节分页结果缓存，翻页更流畅</li>
                <li>重构响应式阅读流程，消除界面卡顿</li>
                <li>增强异常恢复能力，存储/解析异常时自动重建缓存</li>
                <li>优化数据库连接与线程池管理，提升插件稳定性</li>
              </ul>
              <h3>Version 3.0.0</h3>
              <ul>
                <li>Optimized page-turning performance with chapter pagination caching</li>
                <li>Refactored the reactive reading pipeline for a smoother UI</li>
                <li>Enhanced error recovery to automatically rebuild cache on storage/parse errors</li>
                <li>Improved database connection and thread pool management for stability</li>
              </ul>
              """
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

wrapper {
    gradleVersion = '9.7.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae'
    distributionUrl = 'https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip'
}

// Add duplicate handling strategy for Jar tasks
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
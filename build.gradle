plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
    id 'jacoco'
}

group = 'com.lv.tool'
version = '3.1.1'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.aliyun.com/repository/public'
        allowInsecureProtocol = true
    }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.7.1-jre'

    // IntelliJ Platform
    intellijPlatform {
        intellijIdea "2026.1.4"
    }

    // Test dependencies
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation platform('org.mockito:mockito-bom:5.23.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

test {
    useJUnitPlatform()
    // 测试执行完毕后生成 JaCoCo 覆盖率报告
    finalizedBy jacocoTestReport
    jacoco {
        // IntelliJ 平台用 PathClassLoader 加载插件类（无 location），须显式纳入
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

// JaCoCo 覆盖率：report 生成 XML+HTML，verification 依据阈值校验
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // instrumentCode=false 时指向编译产物；插件类由 PathClassLoader 加载，故用编译 classes 目录
    classDirectories.setFrom(sourceSets.main.output.classesDirs)
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                // 基线 18.24%(1383/7581,2026-08-13 首次测量);V9 补测后 LINE 28.02%(2606/7581)
                // V12 阈值上调至 0.27 作为回归护栏,留有约 1 个百分点安全余量
                // V13 补测 ChapterServiceImpl/NotificationServiceImpl + 拆分 FileBookRepository 后 LINE 33.54%(2573/7672),
                // 阈值上调至 0.30 作为回归护栏,留有约 3.5 个百分点安全余量
                // V15 修复缓存清理后 LINE 38.34%;V16 拆分 ChapterEventProcessor 并补测后 LINE 39.95%(3161/7912),
                // 阈值上调至 0.35 作为回归护栏,留有约 5 个百分点安全余量
                // V21 可测性改造 NetworkPerformanceMonitor + 补测章节缓存仓储 CRUD 后 LINE 45.88%(3628/7907),
                // 阈值上调至 0.40 作为回归护栏,留有约 5.8 个百分点安全余量
                // V22 改造 DatabaseManager/NetworkUtils 可测性并补测后 LINE 46.84%(3709/7919),
                // 阈值上调至 0.42 作为回归护栏,留有约 4.8 个百分点安全余量
                // V23 补测 StorageManager/ExceptionHandler/ConfigDiagnosticTool/PrivateReaderConfig/
                // ReaderModeSwitcher 后 LINE 49.34%(3907/7918),阈值上调至 0.45(余量 4.3pp)
                // V24 改造 StorageManager 注入 basePath 补测路径逻辑 + FileBookRepository 阅读位置修复补测后
                // LINE 50.29%(3983/7920),阈值上调至 0.46(余量 4.3pp)
                // V25 补测 NotificationDisplayManager 展示路径(100%)与 BookServiceImpl 增删改后
                // LINE 51.11%(4048/7920),阈值上调至 0.47(余量 4.1pp)
                // V26 补测 ReaderViewModel 意图分发/搜索与书籍 IO 辅助类后 LINE 51.38%(4069/7920),
                // 阈值上调至 0.48(余量 3.4pp)
                // V27 把 ConfigDiagnosticTool 的服务查询抽为 DiagnosticsHosts.Host 并补测,
                // 同时接线 NavigateChapter 意图后 LINE 53.47%(4283/8010),阈值上调至 0.50(余量 3.5pp)
                // V28 为 FileStorageRepository 注入基础路径、为 ExceptionHandler 注入恢复宿主,
                // 并补测 SafeHttpRequestExecutor 统计与 NetworkUtils 探测后 LINE 55.23%(4430/8021),
                // 阈值上调至 0.52(余量 3.2pp)
                // V29 确认 headless 下 Swing/IntelliJ UI 组件可实例化,补测三个设置面板
                // (NotificationReaderConfigurable 100%/ReaderConfigurable 89.4%/CacheConfigurable 54.3%)
                // 后 LINE 59.53%(4775/8021),阈值上调至 0.56(余量 3.5pp)
                minimum = 0.56
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}

intellijPlatform {
    instrumentCode = false

    patchPluginXml {
        sinceBuild = '261'
        changeNotes = """
              <h3>3.1.1 版本更新</h3>
              <ul>
                <li>内部重构:拆分通知栏章节变更处理与章节导航,提升可维护性(无行为变更)</li>
                <li>测试:为两个拆分组件补充回归测试,覆盖率护栏上调至 35%</li>
              </ul>
              <h3>Version 3.1.1</h3>
              <ul>
                <li>Internal refactor: extracted notification-bar chapter-change handling and chapter navigation for maintainability (no behavior change)</li>
                <li>Tests: added regression tests for both extracted components and raised the coverage gate to 35%</li>
              </ul>
              """
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

wrapper {
    gradleVersion = '9.7.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a'
    distributionUrl = 'https://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-bin.zip'
}

// Add duplicate handling strategy for Jar tasks
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
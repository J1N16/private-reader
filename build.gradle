plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
}

group = 'com.lv.tool'
version = '2.5.1'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.aliyun.com/repository/public'
        allowInsecureProtocol = true
    }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.xerial:sqlite-jdbc:3.53.1.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'com.google.code.gson:gson:2.14.0'

    // IntelliJ Platform
    intellijPlatform {
        intellijIdeaCommunity "2024.3"
    }

    // Test dependencies
    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation platform('org.mockito:mockito-bom:5.23.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

test {
    useJUnitPlatform()
}

intellijPlatform {
    instrumentCode = false

    patchPluginXml {
        sinceBuild = '243'
        changeNotes = """
              <h3>2.5.1 版本更新</h3>
              <ul>
                <li>添加网络性能监控器，统一跟踪网络请求耗时和执行状态</li>
                <li>修复无最近阅读记录时初始化失败的问题</li>
                <li>修复安全 HTTP 请求日志中的线程 ID 获取方式</li>
              </ul>
              <h3>Version 2.5.1</h3>
              <ul>
                <li>Added a network performance monitor to track request timing and execution status</li>
                <li>Fixed initialization failures when no recent reading record exists</li>
                <li>Fixed thread ID retrieval in safe HTTP request logs</li>
              </ul>
              """
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

wrapper {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
}

// Add duplicate handling strategy for Jar tasks
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
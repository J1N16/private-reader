plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
    id 'jacoco'
}

group = 'com.lv.tool'
version = '3.2.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.aliyun.com/repository/public'
        allowInsecureProtocol = true
    }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.7.1-jre'

    // IntelliJ Platform
    intellijPlatform {
        intellijIdea "2026.1.4"
    }

    // Test dependencies
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation platform('org.mockito:mockito-bom:5.23.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

test {
    useJUnitPlatform()
    // 测试执行完毕后生成 JaCoCo 覆盖率报告
    finalizedBy jacocoTestReport
    jacoco {
        // IntelliJ 平台用 PathClassLoader 加载插件类（无 location），须显式纳入
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

// JaCoCo 覆盖率：report 生成 XML+HTML，verification 依据阈值校验
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // instrumentCode=false 时指向编译产物；插件类由 PathClassLoader 加载，故用编译 classes 目录
    classDirectories.setFrom(sourceSets.main.output.classesDirs)
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                // 基线 18.24%(1383/7581,2026-08-13 首次测量);V9 补测后 LINE 28.02%(2606/7581)
                // V12 阈值上调至 0.27 作为回归护栏,留有约 1 个百分点安全余量
                // V13 补测 ChapterServiceImpl/NotificationServiceImpl + 拆分 FileBookRepository 后 LINE 33.54%(2573/7672),
                // 阈值上调至 0.30 作为回归护栏,留有约 3.5 个百分点安全余量
                // V15 修复缓存清理后 LINE 38.34%;V16 拆分 ChapterEventProcessor 并补测后 LINE 39.95%(3161/7912),
                // 阈值上调至 0.35 作为回归护栏,留有约 5 个百分点安全余量
                // V21 可测性改造 NetworkPerformanceMonitor + 补测章节缓存仓储 CRUD 后 LINE 45.88%(3628/7907),
                // 阈值上调至 0.40 作为回归护栏,留有约 5.8 个百分点安全余量
                // V22 改造 DatabaseManager/NetworkUtils 可测性并补测后 LINE 46.84%(3709/7919),
                // 阈值上调至 0.42 作为回归护栏,留有约 4.8 个百分点安全余量
                // V23 补测 StorageManager/ExceptionHandler/ConfigDiagnosticTool/PrivateReaderConfig/
                // ReaderModeSwitcher 后 LINE 49.34%(3907/7918),阈值上调至 0.45(余量 4.3pp)
                // V24 改造 StorageManager 注入 basePath 补测路径逻辑 + FileBookRepository 阅读位置修复补测后
                // LINE 50.29%(3983/7920),阈值上调至 0.46(余量 4.3pp)
                // V25 补测 NotificationDisplayManager 展示路径(100%)与 BookServiceImpl 增删改后
                // LINE 51.11%(4048/7920),阈值上调至 0.47(余量 4.1pp)
                // V26 补测 ReaderViewModel 意图分发/搜索与书籍 IO 辅助类后 LINE 51.38%(4069/7920),
                // 阈值上调至 0.48(余量 3.4pp)
                // V27 把 ConfigDiagnosticTool 的服务查询抽为 DiagnosticsHosts.Host 并补测,
                // 同时接线 NavigateChapter 意图后 LINE 53.47%(4283/8010),阈值上调至 0.50(余量 3.5pp)
                // V28 为 FileStorageRepository 注入基础路径、为 ExceptionHandler 注入恢复宿主,
                // 并补测 SafeHttpRequestExecutor 统计与 NetworkUtils 探测后 LINE 55.23%(4430/8021),
                // 阈值上调至 0.52(余量 3.2pp)
                // V29 确认 headless 下 Swing/IntelliJ UI 组件可实例化,补测三个设置面板
                // (NotificationReaderConfigurable 100%/ReaderConfigurable 89.4%/CacheConfigurable 54.3%)
                // 后 LINE 59.53%(4775/8021),阈值上调至 0.56(余量 3.5pp)
                // V30 确认 AnActionEvent/Presentation 可 mock,补测 18 个 UI 动作类与
                // NotificationServiceImpl 活动会话状态机(42.6%→74.1%)后 LINE 63.70%(5109/8021),
                // 阈值上调至 0.60(余量 3.7pp)
                // V31 为 StorageManager 注入 legacy 目录以测迁移(44.2%→85.2%)、
                // 补测 PluginConfigurable(0%→94.1%)与 RepositoryModule(3.0%→90.9%)后
                // LINE 65.18%(5231/8025),阈值上调至 0.61(余量 4.2pp)
                // V32 补测编排类(ReaderModeSwitcher 56.8%→82.0%、
                // NotificationBarModeService 74.9%→79.8%、ChapterNavigator 77.7%→86.0%)
                // 与 FileBookRepository 缺章自愈(64.3%→70.0%)后 LINE 66.04%(5300/8025),
                // 阈值上调至 0.62(余量 4.0pp)
                minimum = 0.62
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}

intellijPlatform {
    instrumentCode = false

    patchPluginXml {
        sinceBuild = '261'
        changeNotes = """
              <h3>3.2.0 版本更新（汇总自 3.1.0）</h3>
              <h4>修复</h4>
              <ul>
                <li>通知栏跨章翻页：修复首页向前翻 / 末页向后翻误报“导航失败”；章节列表与内容统一改用 ChapterService 获取（缓存/网络/过期回退），并校验章节索引 Map，边界提示后复位加载状态</li>
                <li>阅读进度：切换章节时重置页码并写入章节标题；进度表新增书名、章节名与可读阅读时间</li>
                <li>章节目录：倒序目录自动规范为正序，修复从末章开始及上一章/下一章颠倒；修复部分站点编码乱码与目录不完整</li>
                <li>缓存：修复缓存过期时间/最大缓存大小设置不生效、启动清理设置未被读取的问题</li>
                <li>书架与添加书籍：修复书架为空时目录/内容残留、获取上次阅读书籍报错，以及首次添加书籍误报“获取章节列表失败”</li>
                <li>通知栏会话：修复删除当前阅读书籍后仍可翻页，删除时退出通知栏模式并清理阅读会话</li>
                <li>设置面板：修复字体/字号不在下拉列表时误报“已修改”并静默替换字体</li>
              </ul>
              <h4>重构与质量</h4>
              <ul>
                <li>NotificationServiceImpl 拆分为 ChapterEventProcessor、ChapterNavigator、NotificationProgressManager、ChapterContentViewer</li>
                <li>统一章节导航流水线，移除未使用的 Reactive 兼容路径，接线 NavigateChapter 意图</li>
                <li>对 NetworkPerformanceMonitor、DatabaseManager、StorageManager、FileStorageRepository、ExceptionHandler 等进行可测性改造并补充大量单元测试</li>
                <li>LINE 覆盖率提升至 66%+，回归覆盖率阈值提升至 0.62</li>
              </ul>
              <h3>Version 3.2.0 (summary since 3.1.0)</h3>
              <h4>Fixes</h4>
              <ul>
                <li>Cross-chapter navigation: fixed the false “navigation failed” error when paging back from the first page or forward from the last page; chapter lists and content now come from ChapterService (cache/network/stale-cache fallback), the chapter index map is validated, and the loading flag is cleared after boundary notices</li>
                <li>Reading progress: page number now resets on chapter switch and the chapter title is persisted; the progress table records book/chapter titles and a readable read time</li>
                <li>Catalog: reversed chapter lists are normalized to ascending order, fixing starting from the last chapter and inverted prev/next; fixed garbled encoding and incomplete catalogs on some sites</li>
                <li>Cache: fixed cache expiry/max-size settings having no effect and the startup cleanup setting never being read</li>
                <li>Bookshelf and adding books: fixed stale chapter list/content when the bookshelf becomes empty, errors when reading the last-read book, and a false “failed to load chapter list” after adding a book</li>
                <li>Notification session: fixed page turning continuing after the current book was deleted; the mode now exits and the session is cleared</li>
                <li>Settings panel: fixed it falsely reporting “modified” and silently replacing the configured font when the family/size was missing from the dropdowns</li>
              </ul>
              <h4>Refactors & Quality</h4>
              <ul>
                <li>Split NotificationServiceImpl into ChapterEventProcessor, ChapterNavigator, NotificationProgressManager and ChapterContentViewer</li>
                <li>Unified the chapter navigation pipeline, removed the unused reactive compatibility path, and wired the NavigateChapter intent</li>
                <li>Made NetworkPerformanceMonitor, DatabaseManager, StorageManager, FileStorageRepository, ExceptionHandler and others testable, with extensive new unit tests</li>
                <li>LINE coverage raised to 66%+, regression coverage gate raised to 0.62</li>
              </ul>
              """
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

wrapper {
    gradleVersion = '9.7.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a'
    distributionUrl = 'https://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-bin.zip'
}

// Add duplicate handling strategy for Jar tasks
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}